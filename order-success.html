<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Order Received | ThreadCart</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .success-page {
      min-height: calc(100vh - 72px);
      display: grid;
      place-items: center;
      text-align: center;
      padding: 40px 0;
    }
    .success-card {
      max-width: 600px;
      background: #fff;
      border: 1px solid #e7e7e7;
      border-radius: 20px;
      padding: 50px 30px;
      box-shadow: 0 18px 50px rgba(0,0,0,.07);
    }
    .success-icon {
      width: 62px;
      height: 62px;
      display: grid;
      place-items: center;
      margin: 0 auto 20px;
      border-radius: 50%;
      background: #111;
      color: #fff;
      font-size: 28px;
    }
    .success-card h1 {
      font-size: 42px;
      letter-spacing: -2px;
      margin-bottom: 14px;
    }
    .success-card p {
      color: #6d6d6d;
      margin-bottom: 28px;
    }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a href="index.html" class="logo">threadcart</a>
    </div>
  </header>

  <main class="success-page">
    <div class="container">
      <div class="success-card">
        <div class="success-icon">✓</div>
        <h1>Order received.</h1>
        <p>
          Thank you for ordering from ThreadCart. We have received your
          information and will contact you shortly to confirm the order.
        </p>
        <a href="index.html" class="primary-btn">Back to store</a>
      </div>
    </div>
  </main>
</body>
</html>
